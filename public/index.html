<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f2">
  <title>สมุดงาน | Tanetpon</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="หน้าหลัก"><span class="brand-mark">T</span><span>สมุดงาน</span></a>
    <span class="live-pill"><span class="live-dot"></span>ระบบพร้อมใช้งาน</span>
  </header>

  <main class="shell">
    <section class="intro">
      <div>
        <p class="eyebrow">STUDENT WORKSPACE / 2026</p>
        <h1>จัดระเบียบงาน<br><em>ให้ไปต่อได้จริง</em></h1>
        <p class="intro-copy">พื้นที่เล็กๆ สำหรับรวมงานทุกวิชา เห็นสิ่งที่ต้องทำ และฉลองสิ่งที่เสร็จแล้ว</p>
      </div>
      <div class="date-card"><span id="todayLabel">วันนี้</span><strong id="todayDate">--</strong></div>
    </section>

    <section class="stats" aria-label="สรุปงาน">
      <div class="stat"><span>งานทั้งหมด</span><strong id="totalCount">0</strong></div>
      <div class="stat"><span>กำลังทำ</span><strong id="doingCount">0</strong></div>
      <div class="stat accent"><span>เสร็จแล้ว</span><strong id="doneCount">0</strong></div>
      <div class="progress-stat"><div class="progress-label"><span>ความคืบหน้า</span><strong id="progressText">0%</strong></div><div class="progress-track"><div id="progressBar"></div></div></div>
    </section>

    <section class="workspace">
      <div class="toolbar">
        <div><h2>รายการงาน</h2><p id="listHint">กำลังโหลดรายการ...</p></div>
        <button class="primary-button" id="addButton" type="button"><span>+</span> เพิ่มงานใหม่</button>
      </div>
      <div class="filters">
        <label class="search"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="ค้นหางานหรือวิชา..." /></label>
        <div class="filter-buttons" role="group" aria-label="กรองตามสถานะ">
          <button class="filter active" data-filter="all" type="button">ทั้งหมด</button><button class="filter" data-filter="todo" type="button">ยังไม่เริ่ม</button><button class="filter" data-filter="doing" type="button">กำลังทำ</button><button class="filter" data-filter="done" type="button">เสร็จแล้ว</button>
        </div>
      </div>
      <div id="assignmentList" class="assignment-list"></div>
    </section>
  </main>

  <dialog id="assignmentDialog">
    <form id="assignmentForm" method="dialog">
      <div class="dialog-head"><div><p class="eyebrow">NEW ENTRY</p><h2 id="dialogTitle">เพิ่มงานใหม่</h2></div><button class="icon-button" id="closeButton" type="button" aria-label="ปิด">×</button></div>
      <input id="assignmentId" type="hidden">
      <label>ชื่องาน<input id="titleInput" name="title" required maxlength="120" placeholder="เช่น ส่งรายงานวิทยาศาสตร์"></label>
      <div class="form-row"><label>วิชา<input id="subjectInput" name="subject" required maxlength="80" placeholder="เช่น วิทยาศาสตร์"></label><label>กำหนดส่ง<input id="dueDateInput" name="due_date" type="date"></label></div>
      <label>สถานะ<select id="statusInput" name="status"><option value="todo">ยังไม่เริ่ม</option><option value="doing">กำลังทำ</option><option value="done">เสร็จแล้ว</option></select></label>
      <label>โน้ตเพิ่มเติม<textarea id="notesInput" name="notes" rows="3" maxlength="500" placeholder="รายละเอียดสั้นๆ หรือสิ่งที่ต้องเตรียม"></textarea></label>
      <div class="dialog-actions"><button class="text-button" id="cancelButton" type="button">ยกเลิก</button><button class="primary-button" type="submit">บันทึกงาน</button></div>
    </form>
  </dialog>
  <script src="/app.js"></script>
</body>
</html>
