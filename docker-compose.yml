services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tanetpon-student-work-log:local
    container_name: tanetpon-student-work-log
    restart: unless-stopped
    environment:
      PORT: 3000
      DATA_DIR: /app/data
      NODE_ENV: production
    ports:
      - "30022:3000"
    volumes:
      - tanetpon-student-work-log-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - tanetpon-net

volumes:
  tanetpon-student-work-log-data:
    name: tanetpon-student-work-log-data

networks:
  tanetpon-net:
    name: tanetpon-net
