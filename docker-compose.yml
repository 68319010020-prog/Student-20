services:
  app:
    image: ponlpon/student-work-log:latest
    container_name: tanetpon-student-work-log
    restart: unless-stopped
    ports:
      - "30022:3000"
    volumes:
      - tanetpon-student-work-log-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - tanetpon-net

volumes:
  tanetpon-student-work-log-data:
    name: tanetpon-student-work-log-data

networks:
  tanetpon-net:
    name: tanetpon-net
